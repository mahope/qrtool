# One JSON line per CSP report (see the /csp-report location below).
log_format csp_report escape=json '{"time":"$time_iso8601","page":"$http_referer","ua":"$http_user_agent","report":"$request_body"}';

map $request_method $csp_report_post {
    POST 1;
    default 0;
}

server {
    listen 80;
    server_name qrtool.dk www.qrtool.dk;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(self)" always;

    # Force HTTPS (when behind reverse proxy like Dokploy)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy - upgrade insecure requests
    add_header Content-Security-Policy "upgrade-insecure-requests; default-src 'self' https://analytics.holstjensen.eu; script-src 'self' 'unsafe-inline' https://analytics.holstjensen.eu https://stats.mahoje.dk; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://analytics.holstjensen.eu https://stats.mahoje.dk;" always;

    # Stricter Content Security Policy, report-only for now (issue #50). It runs next to the
    # enforced policy above and blocks nothing; violations are POSTed to /csp-report and
    # logged. 'unsafe-inline' stays for scripts because the pages carry page-specific inline
    # scripts; styles need it for the inline <style> blocks and style="" attributes.
    add_header Reporting-Endpoints 'csp="/csp-report"' always;
    add_header Content-Security-Policy-Report-Only "default-src 'none'; script-src 'self' 'unsafe-inline' 'inline-speculation-rules' https://analytics.holstjensen.eu https://stats.mahoje.dk; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://analytics.holstjensen.eu https://stats.mahoje.dk; media-src 'self' blob:; manifest-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /csp-report; report-to csp" always;

    # CSP violation reports: logged to /var/log/nginx/csp-report.log, answered with 204.
    # proxy_pass to the internal listener below makes nginx read the body so $request_body is set.
    location = /csp-report {
        limit_except POST { deny all; }
        client_max_body_size 16k;
        client_body_buffer_size 16k;
        access_log /var/log/nginx/csp-report.log csp_report if=$csp_report_post;
        proxy_pass http://127.0.0.1:8081/;
    }

    # Cache control for static assets
    # Note: Using expires only (no add_header) so server-level security headers are inherited
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
    }

    location ~* \.(css|js)$ {
        expires 7d;
    }

    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 1y;
    }

    # HTML files - short cache
    location ~* \.html$ {
        expires 1h;
    }

    # Service Worker - no caching
    location = /sw.js {
        expires -1;
    }

    # Remove .html extension
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Specific page redirects
    location = /wifi-qr-kode {
        try_files /wifi-qr-kode.html =404;
    }

    location = /privatlivspolitik {
        try_files /privatlivspolitik.html =404;
    }

    location = /om-qr-tool {
        try_files /om-qr-tool.html =404;
    }

    location = /vcard-qr-kode {
        try_files /vcard-qr-kode.html =404;
    }

    location = /email-qr-kode {
        try_files /email-qr-kode.html =404;
    }

    location = /sms-qr-kode {
        try_files /sms-qr-kode.html =404;
    }

    location = /kalender-qr-kode {
        try_files /kalender-qr-kode.html =404;
    }

    location = /tekst-qr-kode {
        try_files /tekst-qr-kode.html =404;
    }

    # Guides section
    location = /guides/ {
        try_files /guides/index.html =404;
    }

    location = /guides/qr-koder-til-restauranter {
        try_files /guides/qr-koder-til-restauranter.html =404;
    }

    location = /guides/qr-koder-til-events {
        try_files /guides/qr-koder-til-events.html =404;
    }

    location = /guides/visitkort-med-qr-kode {
        try_files /guides/visitkort-med-qr-kode.html =404;
    }

    # English version
    location = /en/ {
        try_files /en/index.html =404;
    }

    location = /en/wifi-qr-code {
        try_files /en/wifi-qr-code.html =404;
    }

    location = /en/vcard-qr-code {
        try_files /en/vcard-qr-code.html =404;
    }

    location = /en/email-qr-code {
        try_files /en/email-qr-code.html =404;
    }

    location = /en/sms-qr-code {
        try_files /en/sms-qr-code.html =404;
    }

    location = /en/calendar-qr-code {
        try_files /en/calendar-qr-code.html =404;
    }

    location = /en/text-qr-code {
        try_files /en/text-qr-code.html =404;
    }

    location = /en/about {
        try_files /en/about.html =404;
    }

    location = /en/privacy-policy {
        try_files /en/privacy-policy.html =404;
    }

    location = /en/cookie-policy {
        try_files /en/cookie-policy.html =404;
    }

    location = /en/guides/ {
        try_files /en/guides/index.html =404;
    }

    location = /en/guides/qr-codes-for-restaurants {
        try_files /en/guides/qr-codes-for-restaurants.html =404;
    }

    location = /en/guides/qr-codes-for-events {
        try_files /en/guides/qr-codes-for-events.html =404;
    }

    location = /en/guides/business-cards-with-qr-code {
        try_files /en/guides/business-cards-with-qr-code.html =404;
    }

    # Custom 404 page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to certain file types
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
    }
}

# Internal sink for /csp-report: only reachable from the container itself.
server {
    listen 127.0.0.1:8081;
    access_log off;
    location / {
        return 204;
    }
}
