name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: docker
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify full git history
        run: |
          git log --oneline | wc -l
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git rev-list --count HEAD)" -gt 1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Install Chromium for the real-canvas raster test
        run: |
          npx playwright install --with-deps chromium
          p=$(node -e "console.log(require('playwright').chromium.executablePath())")
          test -x "$p"
          echo "CHROME_BIN=$p" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm test
